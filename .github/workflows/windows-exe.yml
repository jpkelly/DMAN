name: Build Windows executable

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-exe:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install pinned runtime and build dependencies
        run: python -m pip install --only-binary=:all: -r requirements-build-windows.txt
      - name: Test, build and smoke-test the executable
        run: python tools/build_windows.py
      - name: Upload executable package and checksum
        uses: actions/upload-artifact@v4
        with:
          name: DSANDisplay-windows-x64
          path: |
            dist/DSANDisplay-windows-x64.zip
            dist/DSANDisplay.exe.sha256
          if-no-files-found: error
          retention-days: 14
